<!DOCTYPE html>

<html>

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>FastAPI Performance Monitor</title>


    <style>

        * {
            box-sizing: border-box;
        }


        body {

            margin: 0;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            background:
                radial-gradient(
                    circle at top,
                    #172033,
                    #080b12
                );

            color: white;

            min-height: 100vh;

            padding: 30px;
        }


        .container {

            max-width: 1200px;

            margin: auto;
        }


        .header {

            display: flex;

            justify-content:
                space-between;

            align-items: center;

            margin-bottom: 30px;
        }


        .title {

            font-size: 32px;

            font-weight: bold;
        }


        .subtitle {

            color: #9ca3af;

            margin-top: 5px;
        }


        .status {

            display: flex;

            align-items: center;

            gap: 8px;

            padding: 10px 16px;

            border-radius: 30px;

            background: #101827;
        }


        .status-dot {

            width: 10px;

            height: 10px;

            border-radius: 50%;

            background: #22c55e;

            box-shadow:
                0 0 10px #22c55e;

            animation:
                pulse 1.5s infinite;
        }


        @keyframes pulse {

            0% {
                opacity: 1;
            }

            50% {
                opacity: .4;
            }

            100% {
                opacity: 1;
            }
        }


        .dashboard {

            display: grid;

            grid-template-columns:
                repeat(3, 1fr);

            gap: 20px;
        }


        .card {

            background:
                rgba(
                    17,
                    24,
                    39,
                    .85
                );

            border:
                1px solid
                rgba(
                    255,
                    255,
                    255,
                    .08
                );

            border-radius: 18px;

            padding: 20px;

            box-shadow:
                0 20px 50px
                rgba(0,0,0,.25);
        }


        .card-title {

            color: #9ca3af;

            font-size: 14px;

            margin-bottom: 10px;
        }


        .number {

            font-size: 30px;

            font-weight: bold;
        }


        .gauge-card {

            grid-column:
                span 2;

            min-height: 420px;

            display: flex;

            flex-direction: column;

            align-items: center;

            justify-content: center;
        }


        .gauge {

            width: 330px;

            max-width: 100%;
        }


        svg {

            width: 100%;
        }


        .gauge-value {

            font-size: 42px;

            font-weight: bold;

            text-align: center;

            margin-top: -80px;
        }


        .gauge-label {

            text-align: center;

            color: #9ca3af;

            margin-top: 8px;
        }


        .needle {

            transform-origin:
                150px 180px;

            transition:
                transform .25s ease-out;
        }


        .stats {

            display: grid;

            grid-template-columns:
                repeat(2, 1fr);

            gap: 15px;

            width: 100%;

            margin-top: 50px;
        }


        .stat {

            background:
                #0b1120;

            padding: 15px;

            border-radius: 12px;
        }


        .stat-label {

            color: #9ca3af;

            font-size: 13px;
        }


        .stat-value {

            font-size: 20px;

            font-weight: bold;

            margin-top: 5px;
        }


        .chart-card {

            grid-column:
                span 3;
        }


        canvas {

            width: 100%;

            height: 250px;
        }


        .buttons {

            display: flex;

            gap: 10px;

            flex-wrap: wrap;

            margin-top: 20px;
        }


        button {

            border: none;

            padding: 12px 18px;

            border-radius: 10px;

            cursor: pointer;

            background: #2563eb;

            color: white;

            font-weight: bold;
        }


        button:hover {

            background: #1d4ed8;
        }


        button.secondary {

            background: #374151;
        }


        button.danger {

            background: #dc2626;
        }


        @media(max-width: 900px) {

            .dashboard {

                grid-template-columns:
                    1fr;
            }


            .gauge-card,
            .chart-card {

                grid-column:
                    span 1;
            }

        }

    </style>

</head>


<body>


<div class="container">


    <div class="header">

        <div>

            <div class="title">
                ⚡ FastAPI Performance Monitor
            </div>

            <div class="subtitle">
                Real-time API performance dashboard
            </div>

        </div>


        <div class="status">

            <span class="status-dot"></span>

            <span id="status">
                API Connected
            </span>

        </div>

    </div>


    <div class="dashboard">


        <!-- GAUGE -->

        <div class="card gauge-card">


            <div class="card-title">
                REQUESTS PER SECOND
            </div>


            <div class="gauge">


                <svg
                    viewBox="0 0 300 220"
                >


                    <!-- Background -->

                    <path
                        d="
                        M45 180
                        A105 105
                        0 0 1
                        255 180
                        "
                        fill="none"
                        stroke="#374151"
                        stroke-width="20"
                        stroke-linecap="round"
                    />


                    <!-- Active Arc -->

                    <path
                        id="arc"
                        d="
                        M45 180
                        A105 105
                        0 0 1
                        255 180
                        "
                        fill="none"
                        stroke="#22c55e"
                        stroke-width="20"
                        stroke-linecap="round"

                        stroke-dasharray="330"

                        stroke-dashoffset="330"
                    />


                    <!-- Needle -->

                    <line
                        id="needle"
                        class="needle"

                        x1="150"
                        y1="180"

                        x2="150"
                        y2="80"

                        stroke="white"

                        stroke-width="5"

                        stroke-linecap="round"
                    />


                    <!-- Center -->

                    <circle
                        cx="150"
                        cy="180"
                        r="10"

                        fill="white"
                    />


                    <!-- Numbers -->

                    <text
                        x="35"
                        y="205"
                        fill="#9ca3af"
                    >
                        0
                    </text>


                    <text
                        x="140"
                        y="55"
                        fill="#9ca3af"
                    >
                        500
                    </text>


                    <text
                        x="235"
                        y="205"
                        fill="#9ca3af"
                    >
                        1000
                    </text>


                </svg>


                <div
                    class="gauge-value"
                    id="rps"
                >
                    0
                </div>


                <div class="gauge-label">
                    requests / second
                </div>


            </div>


            <div class="buttons">

                <button
                    onclick="generateTraffic()"
                >
                    🚀 Generate Traffic
                </button>


                <button
                    class="secondary"
                    onclick="generateSlowTraffic()"
                >
                    🐢 Slow Requests
                </button>


                <button
                    class="danger"
                    onclick="generateErrors()"
                >
                    ❌ Generate Errors
                </button>

            </div>


        </div>


        <!-- TOTAL REQUESTS -->

        <div class="card">

            <div class="card-title">
                TOTAL REQUESTS
            </div>

            <div
                class="number"
                id="total"
            >
                0
            </div>

        </div>


        <!-- SUCCESS -->

        <div class="card">

            <div class="card-title">
                SUCCESSFUL
            </div>

            <div
                class="number"
                id="success"
            >
                0
            </div>

        </div>


        <!-- ERRORS -->

        <div class="card">

            <div class="card-title">
                ERRORS
            </div>

            <div
                class="number"
                id="errors"
            >
                0
            </div>

        </div>


        <!-- LATENCY -->

        <div class="card">

            <div class="card-title">
                AVG RESPONSE TIME
            </div>

            <div
                class="number"
                id="latency"
            >
                0 ms
            </div>

        </div>


        <!-- CONCURRENT -->

        <div class="card">

            <div class="card-title">
                ACTIVE REQUESTS
            </div>

            <div
                class="number"
                id="active"
            >
                0
            </div>

        </div>


        <!-- CHART -->

        <div class="card chart-card">

            <div class="card-title">
                LIVE REQUEST RATE
            </div>


            <canvas
                id="chart"
                width="1000"
                height="250"
            ></canvas>

        </div>


    </div>


</div>



<script>


let history = [];

let lastTotal = 0;

let lastTime = Date.now();


// --------------------------------------------------
// UPDATE DASHBOARD
// --------------------------------------------------

async function updateDashboard() {


    try {


        const response =
            await fetch("/metrics");


        const data =
            await response.json();


        document.getElementById(
            "total"
        ).innerText =
            data.total_requests;


        document.getElementById(
            "success"
        ).innerText =
            data.successful_requests;


        document.getElementById(
            "errors"
        ).innerText =
            data.failed_requests;


        document.getElementById(
            "latency"
        ).innerText =
            data.average_latency_ms +
            " ms";


        document.getElementById(
            "active"
        ).innerText =
            data.active_requests;


        // -----------------------------------------
        // Calculate RPS
        // -----------------------------------------

        const now =
            Date.now();


        const elapsed =
            (now - lastTime) / 1000;


        let rps = 0;


        if (elapsed > 0) {

            rps =
                (data.total_requests -
                lastTotal) /
                elapsed;

        }


        lastTotal =
            data.total_requests;


        lastTime =
            now;


        rps =
            Math.max(
                0,
                Math.min(
                    1000,
                    rps
                )
            );


        document.getElementById(
            "rps"
        ).innerText =
            Math.round(rps);


        updateGauge(rps);


        history.push(rps);


        if (history.length > 60) {

            history.shift();

        }


        drawChart();


    }

    catch(error) {

        document.getElementById(
            "status"
        ).innerText =
            "API Disconnected";

    }

}


// --------------------------------------------------
// GAUGE
// --------------------------------------------------

function updateGauge(rps) {


    const percentage =
        rps / 1000;


    const angle =
        -90 +
        percentage * 180;


    const radians =
        angle *
        Math.PI /
        180;


    const length = 95;


    const x =
        150 +
        length *
        Math.cos(radians);


    const y =
        180 +
        length *
        Math.sin(radians);


    const needle =
        document.getElementById(
            "needle"
        );


    needle.setAttribute(
        "x2",
        x
    );


    needle.setAttribute(
        "y2",
        y
    );


    const arc =
        document.getElementById(
            "arc"
        );


    arc.style.strokeDashoffset =
        330 -
        (330 * percentage);


}


// --------------------------------------------------
// CHART
// --------------------------------------------------

function drawChart() {


    const canvas =
        document.getElementById(
            "chart"
        );


    const ctx =
        canvas.getContext("2d");


    const width =
        canvas.width;


    const height =
        canvas.height;


    ctx.clearRect(
        0,
        0,
        width,
        height
    );


    if (history.length < 2) {

        return;

    }


    // Grid

    ctx.strokeStyle =
        "#1f2937";


    ctx.lineWidth = 1;


    for (
        let y = 0;
        y <= height;
        y += 50
    ) {

        ctx.beginPath();

        ctx.moveTo(
            0,
            y
        );

        ctx.lineTo(
            width,
            y
        );

        ctx.stroke();

    }


    // Line

    ctx.beginPath();


    history.forEach(
        (value, index) => {


            const x =
                index *
                width /
                59;


            const y =
                height -
                (
                    value /
                    1000
                ) *
                height;


            if (index === 0) {

                ctx.moveTo(
                    x,
                    y
                );

            }

            else {

                ctx.lineTo(
                    x,
                    y
                );

            }

        }
    );


    ctx.strokeStyle =
        "#22c55e";


    ctx.lineWidth = 3;


    ctx.stroke();

}


// --------------------------------------------------
// GENERATE TRAFFIC
// --------------------------------------------------

async function generateTraffic() {


    for (
        let i = 0;
        i < 20;
        i++
    ) {

        fetch(
            "/test"
        );

    }

}


// --------------------------------------------------
// SLOW TRAFFIC
// --------------------------------------------------

async function generateSlowTraffic() {


    for (
        let i = 0;
        i < 10;
        i++
    ) {

        fetch(
            "/api/slow"
        );

    }

}


// --------------------------------------------------
// ERRORS
// --------------------------------------------------

async function generateErrors() {


    for (
        let i = 0;
        i < 10;
        i++
    ) {

        fetch(
            "/api/error"
        );

    }

}


// --------------------------------------------------
// REFRESH
// --------------------------------------------------

setInterval(
    updateDashboard,
    1000
);


updateDashboard();


</script>


</body>

</html>
